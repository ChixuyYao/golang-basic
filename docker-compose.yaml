#    restart: always
#    environment:
#      - ALLOW_EMPTY_PASSWORD=yes
#    ports:
#      - '6379:6379'

  prometheus:
    image: prom/prometheus:v2.47.2
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml
    ports: #暴露端口
      - '9090:9090'
  zipkin:
    image: openzipkin/zipkin-slim:2.24 #简化版Zipkin(不支持Kafka等)
    ports:
      - '9411:9411'
  grafana:
    image: grafana/grafana-enterprise:10.2.0
    ports:
      - '3000:3000'

